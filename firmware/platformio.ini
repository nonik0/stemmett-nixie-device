[platformio]
src_dir = .
default_envs = stella-ota

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/RTClib@^2.1.1
	marcoschwartz/aREST@^2.9.6
	fbiego/ESP32Time@^2.0.5
	wnatth3/WiFiManager@^2.0.16-rc.2

[env:stemmett]
board = um_tinys3
build_flags =
	-D DEVICE_NAME=\"Stemmett\"
	-D ARDUINO_USB_MODE=1
	-D CORE_DEBUG_LEVEL=3
	-D UM_TINYS3
	#-D USE_DS3231_RTC // can't use with light sensor
	#-D USE_PREFERENCES
	#-D USE_WIFI_MANAGER

[env:bowen]
board = seeed_xiao_esp32c3
build_flags =
	-D DEVICE_NAME=\"Bowen\"
	-D CORE_DEBUG_LEVEL=3

[env:stella-usb]
extends = env:stemmett
build_flags =
	${env:stemmett.build_flags}
	-D STELLA

[env:stella-ota]
extends = env:stella-usb
upload_protocol = espota
upload_port = stemmett.local

[env:emmett-usb]
extends = env:stemmett
build_flags =
	${env:stemmett.build_flags}
	-D EMMETT

[env:emmett-ota]
extends = env:emmett-usb
upload_protocol = espota
upload_port = stemmett.local

[env:beau-usb]
extends = env:bowen
build_flags =
	${env:bowen.build_flags}
	-D BEAU

[env:beau-ota]
extends = env:beau-usb
upload_protocol = espota
upload_port = beau.local

[env:owen-usb]
extends = env:bowen
build_flags =
	${env:bowen.build_flags}
	-D OWEN

[env:owen-ota]
extends = env:owen-usb
upload_protocol = espota
upload_port = owen.local
